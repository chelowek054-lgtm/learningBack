[project]
name = "learningback"
version = "0.0.0"
description = "Praxis backend — FastAPI (AI-оркестрация, sync, схема БД)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "anthropic>=0.40",
    "email-validator>=2.2",
    "sqladmin[auth]>=0.31",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
